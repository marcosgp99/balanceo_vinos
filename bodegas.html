<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodegas — Balanceo WO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f0;min-height:100vh}
    #app{max-width:100%;margin:0 auto;background:#fff;min-height:100vh}

    .header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 12px;border-bottom:.5px solid #e0e0d8;flex-wrap:wrap;gap:10px}
    .header h1{font-size:17px;font-weight:600}
    .header-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;font-size:12px;font-weight:500;border-radius:7px;cursor:pointer;transition:background .15s;border:.5px solid #d0d0c8;background:transparent;color:#444}
    .btn:hover{background:#f0f0e8}
    .btn-green{border-color:#5DCAA5;color:#0F6E56;background:#E1F5EE}
    .btn-green:hover{background:#9FE1CB}
    .btn-blue{border-color:#85B7EB;color:#185FA5;background:#E6F1FB}
    .btn-blue:hover{background:#B5D4F4}
    .btn-orange{border-color:#D85A30;color:#993C1D;background:#FAECE7}
    .btn-orange:hover{background:#F5C4B0}
    .btn-save{border-color:#5DCAA5;color:#0F6E56;background:#E1F5EE}
    .btn-save:hover{background:#9FE1CB}

    .status-bar{display:flex;align-items:center;gap:16px;padding:7px 24px;background:#fafaf7;border-bottom:.5px solid #e0e0d8;font-size:12px;color:#666;flex-wrap:wrap}
    .sdot{width:7px;height:7px;border-radius:50%;background:#d0d0c8;flex-shrink:0}
    .sdot.on{background:#1D9E75}
    .status-item{display:flex;align-items:center;gap:5px}

    .tabs-wrap{border-bottom:.5px solid #e0e0d8;padding:0 24px;display:flex;gap:0;overflow-x:auto}
    .tab{padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;border-bottom:2.5px solid transparent;color:#888;background:transparent;white-space:nowrap;flex-shrink:0}
    .tab.on{color:#1a1a1a;border-bottom-color:#1a1a1a}
    .tab:hover:not(.on){color:#444}
    .tab.bodega-tab.on{color:#185FA5;border-bottom-color:#185FA5}

    .panel{display:none;padding:18px 24px}
    .panel.on{display:block}

    .filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .filter-lbl{font-size:12px;color:#888;font-weight:500}
    .fpill{padding:5px 13px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:.5px solid #d0d0c8;color:#666;background:transparent}
    .fpill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
    .fpill.n3{border-color:#D85A30;color:#993C1D}
    .fpill.n3.on{background:#993C1D;color:#fff}

    .table-wrap{overflow-x:auto;border:.5px solid #e0e0d8;border-radius:8px}
    .bod-table{border-collapse:collapse;font-size:12px;min-width:1400px;width:100%}
    .bod-table th{font-size:10px;font-weight:600;color:#888;padding:8px 10px;border-bottom:.5px solid #e0e0d8;background:#fafaf7;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;text-align:left}
    .bod-table th.manual-h{background:#EAF3FB;color:#185FA5}
    .bod-table td{padding:6px 10px;border-bottom:.5px solid #f0f0e8;vertical-align:middle;white-space:nowrap}
    .bod-table tr:last-child td{border-bottom:none}
    .bod-table tr:hover td{background:#fafaf8}
    .bod-table tr.total-row td{background:#f5f5f0;font-weight:600;font-size:12px}
    td.manual{background:#F0F7FF}
    td.manual:hover{background:#E6F1FB}
    .manual-input{width:100%;border:none;background:transparent;font-size:12px;font-family:inherit;color:#1a1a1a;padding:0;outline:none}
    .manual-input:focus{background:#fff;border-bottom:1px solid #378ADD;padding-bottom:1px}
    .manual-input[type="date"]{font-size:11px}
    .sem-pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:500;background:#f0f0e8;color:#888}
    .sep-col{background:#e0e0d8;width:3px;padding:0;border:none}
    .sep-th{background:#e0e0d8;width:3px;padding:0;border:none}

    .empty-state{text-align:center;padding:50px 20px;color:#888}
    .empty-icon{font-size:40px;margin-bottom:10px}
    .empty-title{font-size:15px;font-weight:500;color:#444;margin-bottom:5px}
    .empty-sub{font-size:13px}

    .config-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
    @media(max-width:700px){.config-grid{grid-template-columns:1fr}}
    .config-card{background:#fafaf7;border:.5px solid #e0e0d8;border-radius:9px;padding:14px}
    .config-card-title{font-size:12px;font-weight:600;color:#1a1a1a;margin-bottom:12px}
    .field-row{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
    .field-row label{font-size:11px;color:#888;font-weight:500}
    .field-row input{padding:7px 9px;border:.5px solid #d0d0c8;border-radius:6px;font-size:13px;background:#fff;width:100%}
    .field-row input:focus{outline:none;border-color:#5DCAA5}
    .hint{font-size:11px;color:#aaa;margin-top:2px}
    .btn-primary{padding:8px 18px;background:#1a1a1a;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer}
    .btn-primary:hover{background:#333}
    .save-fb{font-size:12px;color:#0F6E56;margin-left:10px}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:11px;padding:22px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto}
    .modal h2{font-size:15px;font-weight:600;margin-bottom:5px}
    .modal p{font-size:13px;color:#666;margin-bottom:18px}
    .map-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .map-row label{font-size:13px;font-weight:500;min-width:180px;flex-shrink:0}
    .map-row select{flex:1;padding:7px 9px;border:.5px solid #d0d0c8;border-radius:6px;font-size:13px;background:#fff}
    .modal-actions{display:flex;gap:8px;margin-top:18px}
    .btn-secondary{padding:8px 16px;background:transparent;color:#666;border:.5px solid #d0d0c8;border-radius:7px;font-size:13px;cursor:pointer}

    .lts-val{font-weight:500;color:#1a1a1a}
    .merma-val{font-size:10px;color:#aaa;margin-left:4px}
    .total-lts{font-weight:700;color:#0F6E56}
    .link-main{font-size:12px;color:#185FA5;text-decoration:none}
    .link-main:hover{text-decoration:underline}
  </style>
</head>
<body>
<div id="app">

  <header class="header">
    <div style="display:flex;align-items:center;gap:14px">
      <h1>Bodegas — Balanceo WO</h1>
      <a class="link-main" href="index.html">&#8592; Volver al plan</a>
    </div>
    <div class="header-right">
      <button class="btn btn-green" onclick="triggerImport()">&#128203; Importar Plan</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
      <button class="btn btn-orange" onclick="exportBodega()">&#11014; Exportar vista</button>
      <button class="btn btn-save" id="btn-save" onclick="manualSave()">&#128190; Guardar</button>
    </div>
  </header>

  <div class="status-bar">
    <div class="status-item" id="status-plan">
      <span class="sdot" id="sdot-plan"></span><span id="status-plan-txt">Plan: sin cargar</span>
    </div>
    <div style="margin-left:auto;display:flex;gap:12px;align-items:center">
      <span id="save-indicator" style="font-size:11px;color:#aaa"></span>
    </div>
  </div>

  <div class="tabs-wrap" id="tabs-wrap"></div>

  <div id="panels-wrap">
    <div id="panel-config" class="panel">
      <div id="config-container"></div>
    </div>
  </div>

</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title">Mapear columnas</h2>
    <p id="modal-desc">Selecciona las columnas del Excel:</p>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="modal-confirm" onclick="confirmImport()">Confirmar e importar</button>
      <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ── STATE ────────────────────────────────────────────────
const S = {
  planData:   [],
  semanaMap:  {},
  config: {
    bodegas: [
      { nombre:'Bodega 1', filtro:'' },
      { nombre:'Bodega 2', filtro:'' },
      { nombre:'Bodega 3', filtro:'' },
      { nombre:'Bodega 4', filtro:'' }
    ],
    merma: 1000
  },
  manualData: {},
  filtros:    ['Todas','Todas','Todas','Todas'],
  activeTab:  -1,
  rawHeaders: [], rawData: [], loaded: false
};
const SEMANAS = ['N','N+1','N+2','N+3'];

// ── LOCALSTORAGE ─────────────────────────────────────────
function autoSave() {
  try {
    localStorage.setItem('bwo-bodegas-v1', JSON.stringify({
      planData: S.planData, semanaMap: S.semanaMap,
      config: S.config, manualData: S.manualData,
      loaded: S.loaded, ts: new Date().toISOString()
    }));
    const t = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    setSaveInd('Guardado ' + t);
  } catch(e) {}
}
function loadSession() {
  try {
    const raw = localStorage.getItem('bwo-bodegas-v1');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s.planData)   S.planData   = s.planData;
    if (s.semanaMap)  S.semanaMap  = s.semanaMap;
    if (s.manualData) S.manualData = s.manualData;
    if (s.loaded)     S.loaded     = s.loaded;
    if (s.config) {
      if (s.config.bodegas) S.config.bodegas = s.config.bodegas;
      if (s.config.merma)   S.config.merma   = s.config.merma;
    }
    return s.ts;
  } catch(e) { return null; }
}
function manualSave() {
  autoSave();
  const btn = document.getElementById('btn-save');
  if (btn) { btn.textContent = '✓ Guardado'; setTimeout(() => btn.textContent = '💾 Guardar', 2000); }
}
function setSaveInd(msg) {
  const el = document.getElementById('save-indicator');
  if (el) el.textContent = msg;
}

// ── IMPORT ───────────────────────────────────────────────
function triggerImport() {
  document.getElementById('fileInput').click();
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fileInput').addEventListener('change', handleImport);
});

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const wb    = XLSX.read(evt.target.result, { type:'binary' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows  = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:true });
    if (rows.length < 2) { alert('Archivo vacío.'); return; }
    S.rawHeaders = rows[0].map(h => String(h).trim());
    S.rawData    = rows.slice(1).filter(r => r.some(c => c !== ''));
    showMapper(S.rawHeaders, autoDetect(S.rawHeaders));
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
}

function autoDetect(H) {
  const m = { bodega:'', codEq:'', vino:'', semana:'', lts:'', fecha:'',
              tipoFracc:'', descripcion:'', alcohol:'', año:'', wo:'' };
  H.forEach(h => {
    const hl = h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if (!m.bodega    && /bodega|planta|origen/.test(hl))            m.bodega    = h;
    if (!m.codEq     && /codeq|equivalente/.test(hl))               m.codEq     = h;
    if (!m.vino      && /^vino$/.test(hl))                          m.vino      = h;
    if (!m.semana    && /\bsemana\b/.test(hl))                      m.semana    = h;
    if (!m.lts       && /^lts$/.test(hl))                           m.lts       = h;
    if (!m.fecha     && /feinicio|fechainicio/.test(hl))            m.fecha     = h;
    if (!m.tipoFracc && /ordentipo|tipoorden|tipofracc|tipo/.test(hl)) m.tipoFracc = h;
    if (!m.descripcion&&/productodesc|insumodesc|descripcion/.test(hl)) m.descripcion = h;
    if (!m.alcohol   && /alcohol|alc|grado|grad/.test(hl))          m.alcohol   = h;
    if (!m.año       && /cosecha|año|anio|year|vintage/.test(hl))   m.año       = h;
    if (!m.wo        && /^orden$/.test(hl))                         m.wo        = h;
  });
  if (!m.codEq)      m.codEq      = H.find(h => /codeq/i.test(h))          || '';
  if (!m.semana)     m.semana     = H.find(h => /semana/i.test(h))          || '';
  if (!m.lts)        m.lts        = H.find(h => /^lts$/i.test(h))           || '';
  if (!m.descripcion)m.descripcion= H.find(h => /descripcion/i.test(h))     || '';
  if (!m.vino)       m.vino       = H.find(h => /vino/i.test(h))            || '';
  if (!m.wo)         m.wo         = H.find(h => /orden/i.test(h))           || '';
  return m;
}

function showMapper(headers, det) {
  const fields = [
    { key:'bodega',      label:'Bodega (identificador)', req:true  },
    { key:'codEq',       label:'CodEq (cod. equivalente)', req:true  },
    { key:'semana',      label:'Semana',                   req:true  },
    { key:'lts',         label:'Volumen (Lts)',             req:true  },
    { key:'wo',          label:'Nro. WO (Orden)',          req:false },
    { key:'vino',        label:'Codigo de vino (Vino)',    req:false },
    { key:'fecha',       label:'Dia fracc. (FeInicio)',    req:false },
    { key:'tipoFracc',   label:'Tipo fraccionamiento',     req:false },
    { key:'descripcion', label:'Descripcion',              req:false },
    { key:'alcohol',     label:'Alcohol (%)',              req:false },
    { key:'año',         label:'Año / Cosecha',            req:false }
  ];
  document.getElementById('modal-title').textContent = 'Columnas del Plan';
  document.getElementById('modal-desc').textContent  = 'Mapea las columnas del Excel:';
  document.getElementById('modal-fields').innerHTML  = fields.map(f => `
    <div class="map-row">
      <label>${f.label}${f.req?'':' <span style="color:#bbb;font-size:11px">(opc.)</span>'}</label>
      <select id="map-${f.key}">
        ${!f.req?'<option value="">— no usar —</option>':'<option value="">— seleccionar —</option>'}
        ${headers.map(h=>`<option value="${h}"${h===det[f.key]?' selected':''}>${h}</option>`).join('')}
      </select>
    </div>`).join('');
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function confirmImport() {
  const keys = ['bodega','codEq','semana','lts'];
  const m = {};
  ['bodega','codEq','semana','lts','wo','vino','fecha','tipoFracc','descripcion','alcohol','año']
    .forEach(k => { const el = document.getElementById('map-'+k); if (el) m[k] = el.value; });
  if (keys.some(k => !m[k])) { alert('Asigna las columnas obligatorias.'); return; }
  cerrarModal();
  S.planData  = processData(S.rawData, m);
  S.loaded    = true;
  buildSemanaMap();
  updateStatusPlan(S.planData.length + ' filas cargadas');
  autoSave();
  renderAll();
}

function cerrarModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

function processData(rows, m) {
  const H  = S.rawHeaders;
  const ix = k => (m[k] ? H.indexOf(m[k]) : -1);
  const g  = (r, k) => ix(k) >= 0 ? String(r[ix(k)] ?? '').trim() : '';
  return rows.map((r, i) => {
    const woRaw = ix('wo') >= 0 ? r[ix('wo')] : '';
    const wo    = woRaw instanceof Date ? String(woRaw.getTime()) : String(woRaw || 'WO-'+(i+1)).trim();
    return {
      wo, bodega: g(r,'bodega'), codEq: g(r,'codEq'),
      vino:       g(r,'vino'),
      semanaRaw:  g(r,'semana'),
      lts:        parseFloat(ix('lts')>=0 ? r[ix('lts')] : 0) || 0,
      fecha:      fmtFecha(ix('fecha')>=0 ? r[ix('fecha')] : ''),
      tipoFracc:  g(r,'tipoFracc'),
      descripcion:g(r,'descripcion'),
      alcohol:    g(r,'alcohol'),
      año:        g(r,'año')
    };
  }).filter(r => r.codEq && r.lts > 0);
}

function buildSemanaMap() {
  const all    = new Set(S.planData.map(r => r.semanaRaw));
  const sorted = [...all].filter(Boolean).sort((a,b) => {
    const na=parseFloat(a),nb=parseFloat(b);
    return !isNaN(na)&&!isNaN(nb)?na-nb:a.localeCompare(b);
  });
  S.semanaMap = {};
  sorted.forEach((w,i) => { S.semanaMap[w] = SEMANAS[i]||'N+3'; });
}

function updateStatusPlan(txt) {
  document.getElementById('sdot-plan').className = 'sdot on';
  document.getElementById('status-plan-txt').textContent = 'Plan: ' + txt;
}

// ── GROUPED DATA ─────────────────────────────────────────
function getGroupedRows(tabIdx) {
  const bod = S.config.bodegas[tabIdx];
  if (!bod || !bod.filtro) return [];
  const filtroSem = S.filtros[tabIdx];
  const filtered  = S.planData.filter(r => r.bodega === bod.filtro);
  const groups    = {};
  filtered.forEach(r => {
    const sem = S.semanaMap[r.semanaRaw];
    if (!sem) return;
    if (filtroSem !== 'Todas' && sem !== filtroSem) return;
    const key = `${r.codEq}|||${sem}`;
    if (!groups[key]) groups[key] = {
      codEq: r.codEq, semana: sem,
      vinos: new Set(), fecha: r.fecha,
      tipoFracc: r.tipoFracc, descripcion: r.descripcion,
      alcohol: r.alcohol, año: r.año, sumaLts: 0, woCount: 0
    };
    groups[key].vinos.add(r.vino || r.codEq);
    groups[key].sumaLts   += r.lts;
    groups[key].woCount   += 1;
    if (!groups[key].fecha && r.fecha) groups[key].fecha = r.fecha;
  });
  return Object.values(groups).sort((a,b) => {
    const so = {N:0,'N+1':1,'N+2':2,'N+3':3};
    return (so[a.semana]||0)-(so[b.semana]||0) || a.codEq.localeCompare(b.codEq);
  });
}

// ── MANUAL DATA ───────────────────────────────────────────
function saveManual(tabIdx, codEq, semana, field, value) {
  const key = `${tabIdx}|||${codEq}|||${semana}`;
  if (!S.manualData[key]) S.manualData[key] = {};
  S.manualData[key][field] = value;
  autoSave();
}
function getManual(tabIdx, codEq, semana) {
  return S.manualData[`${tabIdx}|||${codEq}|||${semana}`] || {};
}

// ── RENDER ALL ────────────────────────────────────────────
function renderAll() {
  renderTabs();
  for (let i=0; i<4; i++) {
    const panel = document.getElementById('panel-bod-'+i);
    if (panel) renderBodegaPanel(i);
  }
  renderConfigPanel();
}

function renderTabs() {
  const wrap = document.getElementById('tabs-wrap');
  const pwrap = document.getElementById('panels-wrap');
  
  let tabs = S.config.bodegas.map((b,i) =>
    `<button class="tab bodega-tab${S.activeTab===i?' on':''}" onclick="switchTab(${i})">${b.nombre||'Bodega '+(i+1)}</button>`
  ).join('');
  tabs += `<button class="tab${S.activeTab===-1?' on':''}" onclick="switchTab(-1)" style="margin-left:auto">&#9881; Config</button>`;
  wrap.innerHTML = tabs;

  // Create bodega panels if not exist
  for (let i=0; i<4; i++) {
    if (!document.getElementById('panel-bod-'+i)) {
      const p = document.createElement('div');
      p.id = 'panel-bod-'+i;
      p.className = 'panel';
      pwrap.appendChild(p);
    }
  }

  // Show/hide panels
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  if (S.activeTab === -1) {
    document.getElementById('panel-config').classList.add('on');
  } else {
    const p = document.getElementById('panel-bod-'+S.activeTab);
    if (p) { p.classList.add('on'); renderBodegaPanel(S.activeTab); }
  }
}

function switchTab(idx) {
  S.activeTab = idx;
  renderTabs();
}

// ── BODEGA PANEL ──────────────────────────────────────────
function renderBodegaPanel(tabIdx) {
  const panel = document.getElementById('panel-bod-'+tabIdx);
  if (!panel) return;
  const bod  = S.config.bodegas[tabIdx];
  const rows = getGroupedRows(tabIdx);

  const filterPills = ['Todas','N','N+1','N+2','N+3'].map(p =>
    `<button class="fpill${p==='N+3'?' n3':''}${S.filtros[tabIdx]===p?' on':''}"
       onclick="setFiltro(${tabIdx},'${p}')">${p==='Todas'?'Todas las semanas':'Semana '+p}</button>`
  ).join('');

  if (!S.loaded) {
    panel.innerHTML = `
      <div class="filter-bar"><span class="filter-lbl">Semana:</span>${filterPills}</div>
      <div class="empty-state"><div class="empty-icon">&#128230;</div>
      <div class="empty-title">Sin datos</div>
      <div class="empty-sub">Importa el Plan usando el botón "Importar Plan".</div></div>`;
    return;
  }

  if (!bod.filtro) {
    panel.innerHTML = `
      <div class="filter-bar"><span class="filter-lbl">Semana:</span>${filterPills}</div>
      <div class="empty-state"><div class="empty-icon">&#9881;</div>
      <div class="empty-title">Bodega sin configurar</div>
      <div class="empty-sub">Ve a Configuracion y define el nombre y el filtro de esta bodega.</div></div>`;
    return;
  }

  if (!rows.length) {
    panel.innerHTML = `
      <div class="filter-bar"><span class="filter-lbl">Semana:</span>${filterPills}</div>
      <div class="empty-state"><div class="empty-icon">&#128202;</div>
      <div class="empty-title">Sin WOs para "${bod.filtro}"</div>
      <div class="empty-sub">Verifica que el valor del filtro coincide exactamente con la columna Bodega del Excel.</div></div>`;
    return;
  }

  const showSemCol = S.filtros[tabIdx] === 'Todas';
  const totalLts    = rows.reduce((a,r) => a+r.sumaLts, 0);
  const totalConM   = rows.reduce((a,r) => a+r.sumaLts+S.config.merma, 0);

  const tableRows = rows.map(r => {
    const m     = getManual(tabIdx, r.codEq, r.semana);
    const total = r.sumaLts + S.config.merma;
    const vinos = [...r.vinos].join(', ');
    const codEqSafe = r.codEq.replace(/'/g,"\\'");
    const codEqJS   = JSON.stringify(r.codEq);
    return `<tr>
      ${showSemCol?`<td><span class="sem-pill">${r.semana}</span></td>`:''}
      <td style="font-weight:500">${r.codEq}</td>
      <td style="color:#555">${vinos}</td>
      <td style="color:#666">${r.fecha||'—'}</td>
      <td style="color:#666">${r.tipoFracc||'—'}</td>
      <td style="color:#444;max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${r.descripcion}">${r.descripcion||'—'}</td>
      <td style="text-align:center">${r.alcohol||'—'}</td>
      <td style="text-align:center">${r.año||'—'}</td>
      <td class="lts-val" style="text-align:right">${fmtLts(r.sumaLts)}</td>
      <td class="total-lts" style="text-align:right">${fmtLts(total)}<span class="merma-val">+${fmtLts(S.config.merma)}</span></td>
      <td class="sep-col"></td>
      <td class="manual"><input class="manual-input" type="number" placeholder="0 Lts"
        value="${m.volEntrega||''}"
        onchange="saveManual(${tabIdx},${codEqJS},'${r.semana}','volEntrega',this.value)"></td>
      <td class="manual"><input class="manual-input" type="date"
        value="${m.diaEntrega||''}"
        onchange="saveManual(${tabIdx},${codEqJS},'${r.semana}','diaEntrega',this.value)"></td>
      <td class="manual" style="min-width:130px"><input class="manual-input" type="text" placeholder="—"
        value="${(m.papeles||'').replace(/"/g,'&quot;')}"
        onchange="saveManual(${tabIdx},${codEqJS},'${r.semana}','papeles',this.value)"></td>
      <td class="manual" style="min-width:160px"><input class="manual-input" type="text" placeholder="—"
        value="${(m.comentario||'').replace(/"/g,'&quot;')}"
        onchange="saveManual(${tabIdx},${codEqJS},'${r.semana}','comentario',this.value)"></td>
      <td class="manual"><input class="manual-input" type="date"
        value="${m.diaEntregado||''}"
        onchange="saveManual(${tabIdx},${codEqJS},'${r.semana}','diaEntregado',this.value)"></td>
    </tr>`;
  }).join('');

  const totalRow = `<tr class="total-row">
    ${showSemCol?'<td></td>':''}
    <td colspan="7" style="font-size:12px;color:#888">TOTAL ${rows.length} codigo${rows.length>1?'s':''}</td>
    <td style="text-align:right;color:#1a1a1a">${fmtLts(totalLts)}</td>
    <td style="text-align:right;color:#0F6E56">${fmtLts(totalConM)}</td>
    <td class="sep-col"></td>
    <td colspan="5"></td>
  </tr>`;

  panel.innerHTML = `
    <div class="filter-bar">
      <span class="filter-lbl">Semana:</span>
      ${filterPills}
      <span style="margin-left:auto;font-size:11px;color:#aaa">${rows.length} codigo${rows.length>1?'s':''} · ${bod.nombre} (${bod.filtro})</span>
    </div>
    <div class="table-wrap">
      <table class="bod-table">
        <thead><tr>
          ${showSemCol?'<th style="min-width:60px">Semana</th>':''}
          <th style="min-width:140px">CodEq</th>
          <th style="min-width:120px">Cod. Vino</th>
          <th style="min-width:100px">Dia Fracc.</th>
          <th style="min-width:100px">Tipo Fracc.</th>
          <th style="min-width:180px">Descripcion</th>
          <th style="min-width:60px;text-align:center">Alc.</th>
          <th style="min-width:55px;text-align:center">Año</th>
          <th style="min-width:80px;text-align:right">Σ WOs</th>
          <th style="min-width:100px;text-align:right">Σ + Merma</th>
          <th class="sep-th"></th>
          <th class="manual-h" style="min-width:100px">Vol. Entrega</th>
          <th class="manual-h" style="min-width:110px">Dia Entrega</th>
          <th class="manual-h" style="min-width:130px">Datos Papeles</th>
          <th class="manual-h" style="min-width:160px">Comentario Bodega</th>
          <th class="manual-h" style="min-width:110px">Dia Entregado</th>
        </tr></thead>
        <tbody>
          ${tableRows}
          ${totalRow}
        </tbody>
      </table>
    </div>`;
}

function setFiltro(tabIdx, val) {
  S.filtros[tabIdx] = val;
  renderBodegaPanel(tabIdx);
}

// ── CONFIG PANEL ─────────────────────────────────────────
function renderConfigPanel() {
  const cards = S.config.bodegas.map((b,i) => `
    <div class="config-card">
      <div class="config-card-title">Bodega ${i+1}</div>
      <div class="field-row">
        <label>Nombre de la pestana</label>
        <input id="cfg-bod-nombre-${i}" type="text" value="${b.nombre||''}" placeholder="Ej: Trapiche">
      </div>
      <div class="field-row">
        <label>Valor en columna Bodega del Excel</label>
        <input id="cfg-bod-filtro-${i}" type="text" value="${b.filtro||''}" placeholder="Exacto como aparece en el Excel">
        <span class="hint">Debe coincidir exactamente con el valor en el archivo</span>
      </div>
    </div>`).join('');

  document.getElementById('config-container').innerHTML = `
    <div style="max-width:860px">
      <div style="font-size:14px;font-weight:600;margin-bottom:14px;padding-bottom:8px;border-bottom:.5px solid #e0e0d8">Configuracion de bodegas</div>
      <div class="config-grid">${cards}</div>

      <div style="font-size:14px;font-weight:600;margin-bottom:14px;padding-bottom:8px;border-bottom:.5px solid #e0e0d8;margin-top:4px">Parametros generales</div>
      <div class="config-grid">
        <div class="config-card">
          <div class="config-card-title">Merma de linea</div>
          <div class="field-row">
            <label>Lts por codigo equivalente por semana</label>
            <input id="cfg-merma" type="number" value="${S.config.merma||1000}">
            <span class="hint">Se suma al Σ WOs para calcular Σ + Merma</span>
          </div>
        </div>
        <div class="config-card">
          <div class="config-card-title">Bodegas detectadas en el plan</div>
          <div id="bodegas-detectadas" style="font-size:12px;color:#666;line-height:1.8">
            ${S.loaded ? getDetectedBodegas() : '<span style="color:#aaa">Importa el Plan primero.</span>'}
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center">
        <button class="btn-primary" onclick="saveConfig()">Guardar configuracion</button>
        <span id="cfg-ok" class="save-fb"></span>
      </div>
    </div>`;
}

function getDetectedBodegas() {
  const vals = [...new Set(S.planData.map(r => r.bodega).filter(Boolean))].sort();
  if (!vals.length) return '<span style="color:#aaa">Sin bodegas detectadas.</span>';
  return vals.map(v => `<span style="display:inline-block;background:#f0f0e8;border-radius:4px;padding:1px 8px;margin:2px 4px 2px 0;font-size:11px">${v}</span>`).join('');
}

function saveConfig() {
  for (let i=0; i<4; i++) {
    const n = document.getElementById('cfg-bod-nombre-'+i)?.value?.trim();
    const f = document.getElementById('cfg-bod-filtro-'+i)?.value?.trim();
    if (n !== undefined) S.config.bodegas[i].nombre = n || 'Bodega '+(i+1);
    if (f !== undefined) S.config.bodegas[i].filtro = f;
  }
  S.config.merma = parseFloat(document.getElementById('cfg-merma')?.value) || 1000;
  const fb = document.getElementById('cfg-ok');
  if (fb) fb.textContent = '✓ Guardado';
  setTimeout(() => { const e=document.getElementById('cfg-ok'); if(e) e.textContent=''; }, 2500);
  autoSave();
  renderAll();
}

// ── EXPORT ────────────────────────────────────────────────
function exportBodega() {
  if (S.activeTab < 0) { alert('Abrí una pestaña de bodega para exportar.'); return; }
  const tabIdx = S.activeTab;
  const bod    = S.config.bodegas[tabIdx];
  const rows   = getGroupedRows(tabIdx);
  if (!rows.length) { alert('Sin datos para exportar.'); return; }
  const showSem = S.filtros[tabIdx] === 'Todas';

  const header = [
    ...(showSem ? ['Semana'] : []),
    'CodEq','Cod Vino','Dia Fracc.','Tipo Fracc.','Descripcion',
    'Alcohol','Año','Σ WOs (Lts)','Σ + Merma (Lts)',
    'Vol. Entrega','Dia Entrega','Datos Papeles','Comentario Bodega','Dia Entregado'
  ];

  const dataRows = rows.map(r => {
    const m     = getManual(tabIdx, r.codEq, r.semana);
    const total = r.sumaLts + S.config.merma;
    return [
      ...(showSem ? [r.semana] : []),
      r.codEq, [...r.vinos].join(', '), r.fecha||'', r.tipoFracc||'',
      r.descripcion||'', r.alcohol||'', r.año||'',
      r.sumaLts, total,
      m.volEntrega||'', m.diaEntrega||'', m.papeles||'', m.comentario||'', m.diaEntregado||''
    ];
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([header, ...dataRows]);
  ws['!cols'] = header.map((_, i) => ({ wch: i < 9 ? 16 : 14 }));
  XLSX.utils.book_append_sheet(wb, ws, bod.nombre || 'Bodega');
  XLSX.writeFile(wb, `bodega_${(bod.nombre||'bodega').replace(/\s/g,'_')}.xlsx`);
}

// ── UTILS ─────────────────────────────────────────────────
function fmtLts(v) {
  if (!v) return '0';
  if (v>=1000000) return (v/1000000).toFixed(1)+'M';
  if (v>=1000)    return (Math.round(v/100)/10).toFixed(1)+'k';
  return Math.round(v).toString();
}
function fmtFecha(val) {
  if (!val) return '';
  if (val instanceof Date && !isNaN(val)) return val.toLocaleDateString('es-AR');
  const s = String(val).trim();
  const n = parseFloat(s);
  if (!isNaN(n) && n > 1000 && n < 100000)
    return new Date((n-25569)*86400000).toLocaleDateString('es-AR');
  return s.split(' ')[0];
}

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const savedTs = loadSession();
  if (savedTs) {
    updateStatusPlan(S.planData.length + ' filas (sesion)');
    setSaveInd('Sesion del ' + new Date(savedTs).toLocaleDateString('es-AR'));
  }
  S.activeTab = -1;
  renderAll();
});
</script>
