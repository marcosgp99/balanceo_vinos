<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodegas — Programacion CQ, Grupo Peñaflor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f0;min-height:100vh}
    #app{max-width:100%;background:#fff;min-height:100vh}
    .header{display:flex;align-items:center;justify-content:space-between;padding:13px 24px 11px;border-bottom:.5px solid #e0e0d8;flex-wrap:wrap;gap:10px}
    .header h1{font-size:16px;font-weight:600}
    .header-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;font-size:12px;font-weight:500;border-radius:7px;cursor:pointer;transition:background .15s;border:.5px solid #d0d0c8;background:transparent;color:#444;text-decoration:none}
    .btn:hover{background:#f0f0e8}
    .btn-green{border-color:#5DCAA5;color:#0F6E56;background:#E1F5EE}
    .btn-green:hover{background:#9FE1CB}
    .btn-amber{border-color:#EF9F27;color:#633806;background:#FAEEDA}
    .btn-amber:hover{background:#FAC775}
    .btn-save{border-color:#5DCAA5;color:#0F6E56;background:#E1F5EE}
    .btn-purple{border-color:#7F77DD;color:#3C3489;background:#EEEDFE}
    .btn-purple:hover{background:#AFA9EC}
    .status-bar{display:flex;align-items:center;gap:14px;padding:6px 24px;background:#fafaf7;border-bottom:.5px solid #e0e0d8;font-size:11px;color:#666;flex-wrap:wrap}
    .sdot{width:7px;height:7px;border-radius:50%;background:#d0d0c8;display:inline-block}
    .sdot.on{background:#1D9E75}
    .sync-badge{display:inline-block;font-size:10px;background:#E6F1FB;color:#185FA5;padding:1px 7px;border-radius:99px;font-weight:500}
    .tabs-wrap{border-bottom:.5px solid #e0e0d8;padding:0 24px;display:flex;overflow-x:auto}
    .tab{padding:9px 15px;font-size:13px;font-weight:500;cursor:pointer;border:none;border-bottom:2.5px solid transparent;color:#888;background:transparent;white-space:nowrap;flex-shrink:0}
    .tab.on{color:#185FA5;border-bottom-color:#185FA5}
    .tab.cfg{color:#888}
    .tab.cfg.on{color:#1a1a1a;border-bottom-color:#1a1a1a}
    .tab:hover:not(.on){color:#444}
    .panel{display:none;padding:16px 24px}
    .panel.on{display:block}
    .filter-bar{display:flex;align-items:center;gap:7px;margin-bottom:12px;flex-wrap:wrap}
    .filter-lbl{font-size:12px;color:#888;font-weight:500}
    .fpill{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:.5px solid #d0d0c8;color:#666;background:transparent}
    .fpill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
    .fpill.n3{border-color:#D85A30;color:#993C1D}
    .fpill.n3.on{background:#993C1D;color:#fff}

    /* TABLE */
    .table-wrap{overflow-x:auto;border:.5px solid #e0e0d8;border-radius:8px;margin-top:2px}
    .bod-table{border-collapse:collapse;font-size:12px;min-width:1400px;width:100%}
    .bod-table th{font-size:10px;font-weight:600;color:#888;padding:7px 9px;border-bottom:.5px solid #e0e0d8;background:#fafaf7;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;text-align:left}
    .bod-table th.mh{background:#EAF3FB;color:#185FA5}
    .bod-table td{padding:6px 9px;vertical-align:middle;font-size:12px;color:#333}
    .group-first td{border-top:1.5px solid #d5d5cd}
    .group-cont  td{border-top:.5px solid #f0f0e8}
    .group-sep td{height:3px;background:#f5f5f0;padding:0;border:none}
    .total-row td{background:#f5f5f0;font-weight:600;border-top:1.5px solid #d5d5cd}
    td.manual{background:#F0F7FF}
    td.manual:focus-within{background:#E6F1FB}
    .sep-col{background:#e0e0d8;width:2px;padding:0}
    .sep-th{background:#e0e0d8;width:2px;padding:0}
    .manual-input{width:100%;border:none;background:transparent;font-size:12px;font-family:inherit;color:#1a1a1a;padding:0;outline:none;min-width:0}
    .manual-input:focus{border-bottom:1.5px solid #378ADD}
    .manual-input[type=date]{font-size:11px}
    .sem-pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;background:#f0f0e8;color:#888}
    .vino-sub{color:#555;padding-left:16px;font-style:italic}
    .vino-solo{font-weight:500}
    .lts-val{text-align:right;font-weight:500}
    .merma-val{font-size:9px;color:#aaa;display:block}
    .total-lts{text-align:right;font-weight:700;color:#0F6E56}

    /* CONFIG */
    .cfg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
    @media(max-width:700px){.cfg-grid{grid-template-columns:1fr}}
    .cfg-card{background:#fafaf7;border:.5px solid #e0e0d8;border-radius:8px;padding:14px}
    .cfg-card-title{font-size:12px;font-weight:600;margin-bottom:10px}
    .frow{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
    .frow label{font-size:11px;color:#888;font-weight:500}
    .frow input{padding:6px 9px;border:.5px solid #d0d0c8;border-radius:6px;font-size:13px;background:#fff;width:100%}
    .frow input:focus{outline:none;border-color:#5DCAA5}
    .hint{font-size:11px;color:#aaa;margin-top:2px}
    .btn-primary{padding:8px 18px;background:#1a1a1a;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer}
    .btn-primary:hover{background:#333}
    .save-fb{font-size:12px;color:#0F6E56;margin-left:10px}
    .detected-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
    .chip{font-size:11px;background:#f0f0e8;border-radius:4px;padding:2px 8px;cursor:pointer;border:.5px solid #d0d0c8}
    .chip:hover{background:#E1F5EE;border-color:#5DCAA5}

    /* EMPTY */
    .empty-state{text-align:center;padding:50px 20px;color:#888}
    .empty-icon{font-size:38px;margin-bottom:10px}
    .empty-title{font-size:15px;font-weight:500;color:#444;margin-bottom:5px}
    .empty-sub{font-size:13px}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:11px;padding:22px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto}
    .modal h2{font-size:15px;font-weight:600;margin-bottom:5px}
    .modal p{font-size:13px;color:#666;margin-bottom:16px}
    .map-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .map-row label{font-size:13px;font-weight:500;min-width:185px;flex-shrink:0}
    .map-row select{flex:1;padding:7px 9px;border:.5px solid #d0d0c8;border-radius:6px;font-size:13px;background:#fff}
    .modal-actions{display:flex;gap:8px;margin-top:16px}
    .btn-secondary{padding:7px 14px;background:transparent;color:#666;border:.5px solid #d0d0c8;border-radius:7px;font-size:13px;cursor:pointer}
  </style>
</head>
<body>
<div id="app">

  <header class="header">
    <div style="display:flex;align-items:center;gap:14px">
      <h1>Bodegas — Programacion CQ, Grupo Pe&ntilde;aflor</h1>
      <a class="btn" href="index.html">&#8592; Balanceo</a>
    </div>
    <div class="header-right">
      <button class="btn btn-green" onclick="document.getElementById('fileInput').click()">&#128203; Importar Plan</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
      <button class="btn btn-amber" onclick="exportAllBodegas()">&#11014; Exportar Excel (4 bodegas)</button>
      <button class="btn btn-save" id="btn-save" onclick="manualSave()">&#128190; Guardar</button>
    </div>
  </header>

  <div class="status-bar">
    <span class="sdot" id="sdot-plan"></span>
    <span id="status-plan-txt">Plan: sin cargar</span>
    <span id="sync-ind"></span>
    <span style="margin-left:auto" id="save-ind"></span>
  </div>

  <div class="tabs-wrap" id="tabs-wrap"></div>
  <div id="panels-wrap">
    <div id="panel-config" class="panel">
      <div id="config-container"></div>
    </div>
  </div>

</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title">Mapear columnas</h2>
    <p id="modal-desc">Selecciona las columnas del Excel:</p>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="modal-confirm" onclick="confirmImport()">Confirmar e importar</button>
      <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ── CONSTANTES ────────────────────────────────────────────
const SEMANAS = ['N','N+1','N+2','N+3'];
const DIAS_ES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const SHARED_KEY = 'bwo-shared-entregas';

// ── STATE ─────────────────────────────────────────────────
const S = {
  planData: [], semanaMap: {},
  config: {
    bodegas: [
      {nombre:'Bodega 1',filtro:''},{nombre:'Bodega 2',filtro:''},
      {nombre:'Bodega 3',filtro:''},{nombre:'Bodega 4',filtro:''}
    ],
    merma: 1000
  },
  manualData: {},
  filtros:    ['Todas','Todas','Todas','Todas'],
  activeTab:  -1,
  rawHeaders: [], rawData: [], loaded: false
};

// ── LOCALSTORAGE ──────────────────────────────────────────
function autoSave() {
  try {
    localStorage.setItem('bwo-bodegas-v1', JSON.stringify({
      planData:S.planData, semanaMap:S.semanaMap,
      config:S.config, manualData:S.manualData,
      loaded:S.loaded, ts:new Date().toISOString()
    }));
    setSaveInd('Guardado '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}));
  } catch(e) {}
}

function loadSession() {
  try {
    const raw = localStorage.getItem('bwo-bodegas-v1');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s.planData)   S.planData   = s.planData;
    if (s.semanaMap)  S.semanaMap  = s.semanaMap;
    if (s.manualData) S.manualData = s.manualData;
    if (s.loaded)     S.loaded     = s.loaded;
    if (s.config?.bodegas) S.config.bodegas = s.config.bodegas;
    if (s.config?.merma)   S.config.merma   = s.config.merma;
    return s.ts;
  } catch(e) { return null; }
}

function manualSave() {
  autoSave();
  const btn = document.getElementById('btn-save');
  if (btn) { btn.textContent='✓ Guardado'; setTimeout(()=>btn.textContent='💾 Guardar',2000); }
}

function setSaveInd(msg) { const e=document.getElementById('save-ind'); if(e) e.textContent=msg; }

// ── SHARED ENTREGAS (sync con index.html) ─────────────────
function updateSharedEntregas(codEq, semana, vol) {
  try {
    const data = JSON.parse(localStorage.getItem(SHARED_KEY)||'{}');
    const key  = `${codEq}|||${semana}`;
    if (vol > 0) data[key] = vol; else delete data[key];
    localStorage.setItem(SHARED_KEY, JSON.stringify(data));
    showSyncBadge();
  } catch(e) {}
}

function showSyncBadge() {
  const el = document.getElementById('sync-ind');
  if (!el) return;
  el.innerHTML = '<span class="sync-badge">&#8644; Sincronizado con Balanceo</span>';
  clearTimeout(showSyncBadge._t);
  showSyncBadge._t = setTimeout(() => { if(el) el.innerHTML=''; }, 3000);
}

function saveManualAndSync(tabIdx, codEq, semana, field, value) {
  const key = `${tabIdx}|||${codEq}|||${semana}`;
  if (!S.manualData[key]) S.manualData[key] = {};
  S.manualData[key][field] = value;
  if (field === 'volEntrega') updateSharedEntregas(codEq, semana, parseFloat(value)||0);
  autoSave();
}

function getManual(tabIdx, codEq, semana) {
  return S.manualData[`${tabIdx}|||${codEq}|||${semana}`] || {};
}

// ── IMPORT ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fileInput').addEventListener('change', handleImport);
});

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const wb    = XLSX.read(evt.target.result, {type:'binary'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows  = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true});
    if (rows.length<2) { alert('Archivo vacío.'); return; }
    S.rawHeaders = rows[0].map(h=>String(h).trim());
    S.rawData    = rows.slice(1).filter(r=>r.some(c=>c!==''));
    showMapper(S.rawHeaders, autoDetect(S.rawHeaders));
  };
  reader.readAsBinaryString(file);
  e.target.value='';
}

function autoDetect(H) {
  const m={bodega:'',codEq:'',vino:'',semana:'',lts:'',fecha:'',tipoFracc:'',descripcion:'',alcohol:'',año:'',wo:''};
  H.forEach(h=>{
    const hl=h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(!m.bodega     &&/bodega|planta|origen/.test(hl))              m.bodega=h;
    if(!m.codEq      &&/codeq|equivalente/.test(hl))                 m.codEq=h;
    if(!m.vino       &&/^vino$/.test(hl))                            m.vino=h;
    if(!m.semana     &&/\bsemana\b/.test(hl))                        m.semana=h;
    if(!m.lts        &&/^lts$/.test(hl))                             m.lts=h;
    if(!m.fecha      &&/feinicio|fechainicio/.test(hl))              m.fecha=h;
    if(!m.tipoFracc  &&/ordentipo|tipoorden|tipofracc/.test(hl))     m.tipoFracc=h;
    if(!m.descripcion&&/productodesc|insumodesc|descripcion/.test(hl)) m.descripcion=h;
    if(!m.alcohol    &&/alcohol|alc|grado/.test(hl))                 m.alcohol=h;
    if(!m.año        &&/cosecha|año|anio|year|vintage/.test(hl))     m.año=h;
    if(!m.wo         &&/^orden$/.test(hl))                           m.wo=h;
  });
  if(!m.codEq)      m.codEq      =H.find(h=>/codeq/i.test(h))||'';
  if(!m.semana)     m.semana     =H.find(h=>/semana/i.test(h))||'';
  if(!m.lts)        m.lts        =H.find(h=>/^lts$/i.test(h))||'';
  if(!m.descripcion)m.descripcion=H.find(h=>/descripcion/i.test(h))||'';
  if(!m.vino)       m.vino       =H.find(h=>/vino/i.test(h))||'';
  if(!m.wo)         m.wo         =H.find(h=>/orden/i.test(h))||'';
  return m;
}

function showMapper(headers, det) {
  const fields=[
    {key:'bodega',      label:'Bodega (identificador)',    req:true},
    {key:'codEq',       label:'CodEq (cod. equivalente)',  req:true},
    {key:'semana',      label:'Semana',                    req:true},
    {key:'lts',         label:'Volumen (Lts)',              req:true},
    {key:'wo',          label:'Nro. WO (Orden)',           req:false},
    {key:'vino',        label:'Codigo de vino',            req:false},
    {key:'fecha',       label:'Dia fracc. (FeInicio)',     req:false},
    {key:'tipoFracc',   label:'Tipo fraccionamiento',      req:false},
    {key:'descripcion', label:'Descripcion',               req:false},
    {key:'alcohol',     label:'Alcohol (%)',               req:false},
    {key:'año',         label:'Año / Cosecha',             req:false}
  ];
  document.getElementById('modal-title').textContent='Columnas del Plan';
  document.getElementById('modal-desc').textContent='Mapea las columnas del Excel:';
  document.getElementById('modal-fields').innerHTML=fields.map(f=>`
    <div class="map-row">
      <label>${f.label}${f.req?'':' <span style="color:#bbb;font-size:11px">(opc.)</span>'}</label>
      <select id="map-${f.key}">
        ${!f.req?'<option value="">— no usar —</option>':'<option value="">— seleccionar —</option>'}
        ${headers.map(h=>`<option value="${h}"${h===det[f.key]?' selected':''}>${h}</option>`).join('')}
      </select>
    </div>`).join('');
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function confirmImport() {
  const req=['bodega','codEq','semana','lts'];
  const m={};
  ['bodega','codEq','semana','lts','wo','vino','fecha','tipoFracc','descripcion','alcohol','año']
    .forEach(k=>{const el=document.getElementById('map-'+k);if(el)m[k]=el.value;});
  if(req.some(k=>!m[k])){alert('Asigna las columnas obligatorias.');return;}
  cerrarModal();
  S.planData=processData(S.rawData,m);
  S.loaded=true;
  buildSemanaMap();
  document.getElementById('sdot-plan').className='sdot on';
  document.getElementById('status-plan-txt').textContent='Plan: '+S.planData.length+' filas cargadas';
  autoSave();
  renderAll();
}

function cerrarModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

function processData(rows,m) {
  const H=S.rawHeaders;
  const ix=k=>(m[k]?H.indexOf(m[k]):-1);
  const g=(r,k)=>ix(k)>=0?String(r[ix(k)]??'').trim():'';
  return rows.map((r,i)=>{
    const woRaw=ix('wo')>=0?r[ix('wo')]:'';
    const wo=woRaw instanceof Date?String(woRaw.getTime()):String(woRaw||'WO-'+(i+1)).trim();
    return {
      wo, bodega:g(r,'bodega'), codEq:g(r,'codEq'), vino:g(r,'vino'),
      semanaRaw:g(r,'semana'), lts:parseFloat(ix('lts')>=0?r[ix('lts')]:0)||0,
      fecha:fmtFecha(ix('fecha')>=0?r[ix('fecha')]:''),
      tipoFracc:g(r,'tipoFracc'), descripcion:g(r,'descripcion'),
      alcohol:g(r,'alcohol'), año:g(r,'año')
    };
  }).filter(r=>r.codEq&&r.lts>0);
}

function buildSemanaMap() {
  const all=[...new Set(S.planData.map(r=>r.semanaRaw))];
  const sorted=all.filter(Boolean).sort((a,b)=>{
    const na=parseFloat(a),nb=parseFloat(b);
    return !isNaN(na)&&!isNaN(nb)?na-nb:a.localeCompare(b);
  });
  S.semanaMap={};
  sorted.forEach((w,i)=>{S.semanaMap[w]=SEMANAS[i]||'N+3';});
}

// ── GROUPING ──────────────────────────────────────────────
function getGroupedRows(tabIdx, forceAll) {
  const bod=S.config.bodegas[tabIdx];
  if(!bod?.filtro) return [];
  const fSem=forceAll?'Todas':S.filtros[tabIdx];
  const filtered=S.planData.filter(r=>r.bodega===bod.filtro);
  const groups={};

  filtered.forEach(r=>{
    const sem=S.semanaMap[r.semanaRaw];
    if(!sem||(fSem!=='Todas'&&sem!==fSem)) return;
    const gKey=`${r.codEq}|||${sem}`;
    if(!groups[gKey]) groups[gKey]={
      codEq:r.codEq, semana:sem, firstFecha:r.fecha, vinoMap:{}
    };
    // Track first (earliest) date
    if(!groups[gKey].firstFecha && r.fecha) groups[gKey].firstFecha=r.fecha;

    // Group by vino+tipoFracc within the CodEq+semana group
    const vKey=`${r.vino||r.codEq}|||${r.tipoFracc||''}`;
    if(!groups[gKey].vinoMap[vKey]) {
      groups[gKey].vinoMap[vKey]={
        vino:r.vino||r.codEq, tipoFracc:r.tipoFracc,
        descripcion:r.descripcion, alcohol:r.alcohol, año:r.año, sumaLts:0
      };
    }
    groups[gKey].vinoMap[vKey].sumaLts+=r.lts;
  });

  return Object.values(groups).map(g=>({
    ...g,
    diaName: getDayName(g.firstFecha),
    vinoRows: Object.values(g.vinoMap).sort((a,b)=>(a.vino||'').localeCompare(b.vino||''))
  })).sort((a,b)=>{
    const so={N:0,'N+1':1,'N+2':2,'N+3':3};
    return (so[a.semana]||0)-(so[b.semana]||0)||a.codEq.localeCompare(b.codEq);
  });
}

// ── DAY NAME ──────────────────────────────────────────────
function getDayName(fechaStr) {
  if(!fechaStr) return '—';
  // DD/MM/YYYY (es-AR format from fmtFecha)
  const dmy=fechaStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(dmy) return DIAS_ES[new Date(+dmy[3],+dmy[2]-1,+dmy[1]).getDay()];
  // YYYY-MM-DD
  const ymd=fechaStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(ymd) return DIAS_ES[new Date(+ymd[1],+ymd[2]-1,+ymd[3]).getDay()];
  // Excel serial
  const n=parseFloat(fechaStr);
  if(!isNaN(n)&&n>1000) return DIAS_ES[new Date((n-25569)*86400000).getDay()];
  return '—';
}

// ── RENDER ALL ────────────────────────────────────────────
function renderAll() {
  renderTabs();
  for(let i=0;i<4;i++){
    const p=document.getElementById('panel-bod-'+i);
    if(p) renderBodegaPanel(i);
  }
  renderConfigPanel();
}

function renderTabs() {
  const wrap=document.getElementById('tabs-wrap');
  const pwrap=document.getElementById('panels-wrap');
  for(let i=0;i<4;i++){
    if(!document.getElementById('panel-bod-'+i)){
      const p=document.createElement('div');
      p.id='panel-bod-'+i; p.className='panel';
      pwrap.appendChild(p);
    }
  }
  wrap.innerHTML=S.config.bodegas.map((b,i)=>
    `<button class="tab${S.activeTab===i?' on':''}" onclick="switchTab(${i})">${b.nombre||'Bodega '+(i+1)}</button>`
  ).join('')+`<button class="tab cfg${S.activeTab===-1?' on':''}" onclick="switchTab(-1)" style="margin-left:auto">&#9881; Config</button>`;

  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  const pid=S.activeTab===-1?'panel-config':'panel-bod-'+S.activeTab;
  const panel=document.getElementById(pid);
  if(panel){
    panel.classList.add('on');
    if(S.activeTab>=0) renderBodegaPanel(S.activeTab);
  }
}

function switchTab(idx) { S.activeTab=idx; renderTabs(); }

// ── BODEGA PANEL ──────────────────────────────────────────
function renderBodegaPanel(tabIdx) {
  const panel=document.getElementById('panel-bod-'+tabIdx);
  if(!panel) return;
  const bod=S.config.bodegas[tabIdx];

  const pills=['Todas','N','N+1','N+2','N+3'].map(p=>
    `<button class="fpill${p==='N+3'?' n3':''}${S.filtros[tabIdx]===p?' on':''}"
       onclick="setFiltro(${tabIdx},'${p}')">${p==='Todas'?'Todas las semanas':'Semana '+p}</button>`
  ).join('');

  if(!S.loaded){
    panel.innerHTML=`<div class="filter-bar"><span class="filter-lbl">Semana:</span>${pills}</div>
      <div class="empty-state"><div class="empty-icon">&#128230;</div>
      <div class="empty-title">Sin datos</div><div class="empty-sub">Importa el Plan primero.</div></div>`;
    return;
  }
  if(!bod.filtro){
    panel.innerHTML=`<div class="filter-bar"><span class="filter-lbl">Semana:</span>${pills}</div>
      <div class="empty-state"><div class="empty-icon">&#9881;</div>
      <div class="empty-title">Bodega sin configurar</div>
      <div class="empty-sub">Ve a Config y completa el nombre y filtro.</div></div>`;
    return;
  }

  const rows=getGroupedRows(tabIdx);
  if(!rows.length){
    panel.innerHTML=`<div class="filter-bar"><span class="filter-lbl">Semana:</span>${pills}</div>
      <div class="empty-state"><div class="empty-icon">&#128202;</div>
      <div class="empty-title">Sin WOs para "${bod.filtro}"</div>
      <div class="empty-sub">Verifica que el filtro coincide exactamente con la columna Bodega del Excel.</div></div>`;
    return;
  }

  panel.innerHTML=`
    <div class="filter-bar">
      <span class="filter-lbl">Semana:</span>${pills}
      <span style="margin-left:auto;font-size:11px;color:#aaa">${rows.length} codigo${rows.length>1?'s':''} &middot; ${bod.nombre} (${bod.filtro})</span>
    </div>
    ${renderTable(tabIdx,rows)}`;
}

function setFiltro(tabIdx,val){S.filtros[tabIdx]=val;renderBodegaPanel(tabIdx);}

// ── TABLE RENDER ──────────────────────────────────────────
function renderTable(tabIdx, groups) {
  const showSem=S.filtros[tabIdx]==='Todas';
  let tbody='';
  let totalWOs=0, totalM=0;

  groups.forEach(g=>{
    const m       =getManual(tabIdx,g.codEq,g.semana);
    const nVinos  =g.vinoRows.length;
    const sumWOs  =g.vinoRows.reduce((a,v)=>a+v.sumaLts,0);
    const sumMerma=sumWOs+S.config.merma;
    totalWOs+=sumWOs; totalM+=sumMerma;
    const rs=`rowspan="${nVinos}"`;
    const codEqJS=JSON.stringify(g.codEq);

    g.vinoRows.forEach((v,idx)=>{
      const first=idx===0;
      const solo=nVinos===1;
      tbody+=`<tr class="${first?'group-first':'group-cont'}">`;

      // SEMANA (rowspan, first only)
      if(showSem&&first) tbody+=`<td ${rs} style="vertical-align:top;padding-top:7px"><span class="sem-pill">${g.semana}</span></td>`;

      // CODEQ (rowspan, first only)
      if(first) tbody+=`<td ${rs} style="font-weight:600;vertical-align:top;padding-top:7px">${g.codEq}</td>`;

      // VINO (per row, indented if multiple)
      tbody+=`<td class="${solo?'vino-solo':'vino-sub'}">${v.vino||'—'}</td>`;

      // DIA (rowspan, first only)
      if(first) tbody+=`<td ${rs} style="font-weight:500;vertical-align:middle">${g.diaName}</td>`;

      // PER-ROW: tipo, desc, alcohol, año, sumaLts
      tbody+=`<td>${v.tipoFracc||'—'}</td>`;
      tbody+=`<td style="max-width:170px;overflow:hidden;text-overflow:ellipsis" title="${(v.descripcion||'').replace(/"/g,'&quot;')}">${v.descripcion||'—'}</td>`;
      tbody+=`<td style="text-align:center">${v.alcohol||'—'}</td>`;
      tbody+=`<td style="text-align:center">${v.año||'—'}</td>`;
      tbody+=`<td class="lts-val">${fmtLts(v.sumaLts)}</td>`;

      // TOTAL+MERMA (rowspan, first only)
      if(first) tbody+=`<td ${rs} class="total-lts" style="vertical-align:middle">${fmtLts(sumMerma)}<span class="merma-val">+${fmtLts(S.config.merma)} merma</span></td>`;

      // SEPARATOR (rowspan, first only)
      if(first) tbody+=`<td class="sep-col" ${rs}></td>`;

      // MANUAL FIELDS (rowspan, first only)
      if(first) tbody+=`
        <td class="manual" ${rs}><input class="manual-input" type="number" placeholder="0 Lts"
          value="${m.volEntrega||''}"
          onchange="saveManualAndSync(${tabIdx},${codEqJS},'${g.semana}','volEntrega',this.value)"></td>
        <td class="manual" ${rs}><input class="manual-input" type="date"
          value="${m.diaEntrega||''}"
          onchange="saveManualAndSync(${tabIdx},${codEqJS},'${g.semana}','diaEntrega',this.value)"></td>
        <td class="manual" ${rs}><input class="manual-input" type="text" placeholder="—"
          value="${(m.papeles||'').replace(/"/g,'&quot;')}"
          onchange="saveManualAndSync(${tabIdx},${codEqJS},'${g.semana}','papeles',this.value)"></td>
        <td class="manual" ${rs}><input class="manual-input" type="text" placeholder="—"
          value="${(m.comentario||'').replace(/"/g,'&quot;')}"
          onchange="saveManualAndSync(${tabIdx},${codEqJS},'${g.semana}','comentario',this.value)"></td>
        <td class="manual" ${rs}><input class="manual-input" type="date"
          value="${m.diaEntregado||''}"
          onchange="saveManualAndSync(${tabIdx},${codEqJS},'${g.semana}','diaEntregado',this.value)"></td>`;

      tbody+='</tr>';
    });
    tbody+=`<tr class="group-sep"><td colspan="50"></td></tr>`;
  });

  // TOTALS ROW
  const extraCols=showSem?1:0;
  tbody+=`<tr class="total-row">
    ${showSem?'<td></td>':''}
    <td colspan="8" style="color:#888">TOTAL &mdash; ${groups.length} codigo${groups.length>1?'s':''}</td>
    <td class="lts-val">${fmtLts(totalWOs)}</td>
    <td class="total-lts">${fmtLts(totalM)}</td>
    <td colspan="6"></td>
  </tr>`;

  return `<div class="table-wrap">
    <table class="bod-table">
      <thead><tr>
        ${showSem?'<th style="min-width:65px">Semana</th>':''}
        <th style="min-width:140px">CodEq</th>
        <th style="min-width:110px">Cod. Vino</th>
        <th style="min-width:90px">Dia Fracc.</th>
        <th style="min-width:100px">Tipo Fracc.</th>
        <th style="min-width:170px">Descripcion</th>
        <th style="min-width:50px;text-align:center">Alc.</th>
        <th style="min-width:50px;text-align:center">Año</th>
        <th style="min-width:80px;text-align:right">&#931; WOs</th>
        <th style="min-width:100px;text-align:right">&#931;+Merma</th>
        <th class="sep-th"></th>
        <th class="mh" style="min-width:100px">Vol. Entrega</th>
        <th class="mh" style="min-width:110px">Dia Entrega</th>
        <th class="mh" style="min-width:130px">Datos Papeles</th>
        <th class="mh" style="min-width:155px">Comentario Bodega</th>
        <th class="mh" style="min-width:110px">Dia Entregado</th>
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

// ── EXPORT (1 Excel, 4 hojas) ─────────────────────────────
function exportAllBodegas() {
  const wb=XLSX.utils.book_new();
  let added=0;

  for(let i=0;i<4;i++){
    const bod=S.config.bodegas[i];
    const rows=getGroupedRows(i,true); // forceAll=true → todas las semanas
    if(!rows.length) continue;

    const header=['Semana','CodEq','Cod. Vino','Dia Fracc.','Tipo Fracc.',
                  'Descripcion','Alcohol','Año','Σ WOs (Lts)','Σ+Merma (Lts)',
                  'Vol. Entrega','Dia Entrega','Datos Papeles','Comentario','Dia Entregado'];
    const dataRows=[];

    rows.forEach(g=>{
      const m=getManual(i,g.codEq,g.semana);
      const sumWOs=g.vinoRows.reduce((a,v)=>a+v.sumaLts,0);
      const sumM  =sumWOs+S.config.merma;
      g.vinoRows.forEach((v,idx)=>{
        const first=idx===0;
        dataRows.push([
          first?g.semana:'',
          first?g.codEq:'',
          v.vino||'', first?g.diaName:'',
          v.tipoFracc||'', v.descripcion||'', v.alcohol||'', v.año||'',
          v.sumaLts, first?sumM:'',
          first?(m.volEntrega||''):'',
          first?(m.diaEntrega||''):'',
          first?(m.papeles||''):'',
          first?(m.comentario||''):'',
          first?(m.diaEntregado||''):''
        ]);
      });
      dataRows.push([]); // separador entre grupos
    });

    // Fila de totales al final
    const tWOs=rows.reduce((a,g)=>a+g.vinoRows.reduce((b,v)=>b+v.sumaLts,0),0);
    const tM  =rows.reduce((a,g)=>a+g.vinoRows.reduce((b,v)=>b+v.sumaLts,0)+S.config.merma,0);
    dataRows.push(['TOTAL','','','','','','','',tWOs,tM,'','','','','']);

    const ws=XLSX.utils.aoa_to_sheet([header,...dataRows]);
    ws['!cols']=header.map((_,c)=>({wch:c===5?26:c===1?18:14}));
    // Negrita en header
    const range=XLSX.utils.decode_range(ws['!ref']);
    for(let C=range.s.c;C<=range.e.c;C++){
      const cell=ws[XLSX.utils.encode_cell({r:0,c:C})];
      if(cell) cell.s={font:{bold:true},fill:{fgColor:{rgb:'F5F5F0'}}};
    }
    XLSX.utils.book_append_sheet(wb, ws, (bod.nombre||'Bodega '+(i+1)).substring(0,31));
    added++;
  }

  if(!added){alert('Sin datos para exportar. Configura las bodegas y asegúrate de que el filtro coincide con el Excel.');return;}
  const fecha=new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
  XLSX.writeFile(wb,`bodegas_${fecha}.xlsx`);
}

// ── CONFIG PANEL ──────────────────────────────────────────
function renderConfigPanel() {
  const detected=S.loaded
    ? [...new Set(S.planData.map(r=>r.bodega).filter(Boolean))].sort()
    : [];

  const cards=S.config.bodegas.map((b,i)=>`
    <div class="cfg-card">
      <div class="cfg-card-title">Bodega ${i+1}</div>
      <div class="frow">
        <label>Nombre de la pestana</label>
        <input id="cfg-bn-${i}" type="text" value="${b.nombre||''}" placeholder="Ej: Trapiche">
      </div>
      <div class="frow">
        <label>Valor exacto en columna Bodega del Excel</label>
        <input id="cfg-bf-${i}" type="text" value="${b.filtro||''}" placeholder="Como aparece en el archivo">
        <span class="hint">Debe coincidir exactamente (mayusculas, espacios)</span>
      </div>
    </div>`).join('');

  const chips=detected.length
    ? `<div style="font-size:12px;color:#666;margin-bottom:6px">Hac&eacute; clic en un valor para copiarlo:</div>
       <div class="detected-chips">${detected.map(v=>`<span class="chip" onclick="navigator.clipboard.writeText('${v.replace(/'/g,"\\'")}').then(()=>alert('Copiado: ${v.replace(/'/g,"\\'")}'))">${v}</span>`).join('')}</div>`
    : '<span style="color:#aaa;font-size:12px">Importa el Plan para ver los valores disponibles.</span>';

  document.getElementById('config-container').innerHTML=`
    <div style="max-width:900px">
      <div style="font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:7px;border-bottom:.5px solid #e0e0d8">Configuracion de bodegas</div>
      <div class="cfg-grid">${cards}</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:7px;border-bottom:.5px solid #e0e0d8;margin-top:4px">Parametros</div>
      <div class="cfg-grid">
        <div class="cfg-card">
          <div class="cfg-card-title">Merma de linea</div>
          <div class="frow">
            <label>Lts por CodEq por semana</label>
            <input id="cfg-merma" type="number" value="${S.config.merma||1000}">
          </div>
        </div>
        <div class="cfg-card">
          <div class="cfg-card-title">Valores detectados en el plan</div>
          ${chips}
        </div>
      </div>
      <div style="display:flex;align-items:center">
        <button class="btn-primary" onclick="saveConfig()">Guardar configuracion</button>
        <span id="cfg-ok" class="save-fb"></span>
      </div>
    </div>`;
}

function saveConfig() {
  for(let i=0;i<4;i++){
    const n=document.getElementById('cfg-bn-'+i)?.value?.trim();
    const f=document.getElementById('cfg-bf-'+i)?.value?.trim();
    if(n!==undefined) S.config.bodegas[i].nombre=n||'Bodega '+(i+1);
    if(f!==undefined) S.config.bodegas[i].filtro=f;
  }
  S.config.merma=parseFloat(document.getElementById('cfg-merma')?.value)||1000;
  const fb=document.getElementById('cfg-ok');
  if(fb){fb.textContent='✓ Guardado';setTimeout(()=>{const e=document.getElementById('cfg-ok');if(e)e.textContent='';},2500);}
  autoSave(); renderAll();
}

// ── UTILS ─────────────────────────────────────────────────
function fmtLts(v){
  if(!v) return '0';
  if(v>=1000000) return (v/1000000).toFixed(1)+'M';
  if(v>=1000)    return (Math.round(v/100)/10).toFixed(1)+'k';
  return Math.round(v).toString();
}
function fmtFecha(val){
  if(!val) return '';
  if(val instanceof Date&&!isNaN(val)) return val.toLocaleDateString('es-AR');
  const s=String(val).trim();
  const n=parseFloat(s);
  if(!isNaN(n)&&n>1000&&n<100000) return new Date((n-25569)*86400000).toLocaleDateString('es-AR');
  return s.split(' ')[0];
}

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  const ts=loadSession();
  if(ts){
    document.getElementById('sdot-plan').className='sdot on';
    document.getElementById('status-plan-txt').textContent='Plan: '+S.planData.length+' filas (sesion)';
    setSaveInd('Sesion del '+new Date(ts).toLocaleDateString('es-AR'));
  }
  S.activeTab=-1;
  renderAll();
});
